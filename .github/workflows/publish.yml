name: Publicar DC MOTRIX en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio multipágina
        run: |
          mkdir -p site
          unzip -o DC_MOTRIX_prototipo_web.zip -d site
          cp -a site/dc_motrix_web/. site/
          rm -rf site/dc_motrix_web
          cp index.html site/index.html
          mkdir -p site/assets
          cp -a assets/. site/assets/
          touch site/.nojekyll
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
