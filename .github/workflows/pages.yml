name: Publicar sitio DC MOTRIX

on:
  push:
    branches: [main]
    paths:
      - "DC_MOTRIX_prototipo_web.zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Extraer sitio web
        run: |
          mkdir -p extracted site
          unzip -q DC_MOTRIX_prototipo_web.zip -d extracted
          INDEX_FILE="$(find extracted -type f -name index.html | head -n 1)"
          if [ -z "$INDEX_FILE" ]; then
            echo "No se encontró index.html dentro del ZIP"
            exit 1
          fi
          SITE_DIR="$(dirname "$INDEX_FILE")"
          cp -R "$SITE_DIR"/. site/
          touch site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
