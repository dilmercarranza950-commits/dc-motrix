<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administrativo | DC MOTRIX</title><style>
:root{--bg:#080d14;--panel:#111d2a;--line:#2b3c50;--blue:#087bea;--cyan:#24a8ff;--muted:#9eafc0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fb;font:14px Arial}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 70% 15%,#07549b55,transparent 42%),var(--bg)}.login{width:min(420px,100%);padding:30px;background:linear-gradient(145deg,#142335,#0d151f);border:1px solid var(--line);border-radius:16px}.logo{font-size:26px;font-weight:900;letter-spacing:3px}.logo span{color:var(--cyan)}.sub{font-size:10px;letter-spacing:3px;color:var(--muted)}h1{font-size:25px;margin:28px 0 8px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:11px;color:#c5d2df;font-weight:bold}.field input{padding:13px;background:#080f18;border:1px solid var(--line);border-radius:8px;color:white}.btn{border:0;background:var(--blue);color:white;padding:13px 17px;border-radius:8px;font-weight:800}.full{width:100%;margin-top:8px}.link{color:var(--cyan);background:none;border:0;padding:12px 0;font-size:12px}.notice{margin-top:18px;padding:12px;border:1px solid #805e25;background:#392b143d;border-radius:8px;color:#e9c98b;font-size:11px;line-height:1.5}.layout{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#0b131e;border-right:1px solid var(--line);padding:22px 14px}.sidehead{padding:0 12px 20px;border-bottom:1px solid var(--line)}.sidehead small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:4px}.menu{display:grid;gap:5px;margin-top:18px}.menu button{display:flex;gap:12px;text-align:left;color:#c2ceda;background:transparent;border:0;border-radius:8px;padding:12px;font-size:12px}.menu button.active,.menu button:hover{background:#12345a;color:white}.menu b{width:18px;color:var(--cyan)}.main{min-width:0}.topbar{height:68px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.topbar small{color:var(--muted)}.content{padding:28px;max-width:1400px;margin:auto}.heading{margin-bottom:22px}.heading h1{margin:0;font-size:25px}.heading p{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,#142335,#0d151f);border:1px solid var(--line);border-radius:12px;padding:19px}.card small{color:var(--muted);font-size:11px}.number{font-size:27px;font-weight:900;margin:12px 0 4px}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.panel h2{font-size:15px;margin:0 0 15px}.quick{display:flex;gap:9px;flex-wrap:wrap}.quick button{background:#102a45;color:#dceeff;border:1px solid #24517a;padding:10px 12px;border-radius:7px;font-size:11px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{padding:12px;border-right:0;border-bottom:1px solid var(--line)}.sidehead{padding:5px 8px 12px}.menu{display:flex;overflow:auto;margin-top:10px}.menu button{white-space:nowrap}.topbar{padding:0 16px}.content{padding:20px 15px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.cards,.section-grid{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar input,.form-grid input,.form-grid select,.form-grid textarea{background:#080f18;border:1px solid var(--line);border-radius:8px;color:#f4f7fb;padding:11px;width:100%;min-width:0}.toolbar input{max-width:360px}.action{border:1px solid #24517a;background:#102a45;color:#e5f3ff;padding:10px 13px;border-radius:8px;font-size:12px}.action.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:800}.action.danger{border-color:#743d48;color:#ffc1c8;background:#351923}.data-table{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}.data-table th,.data-table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.data-table th{color:#9eafc0;font-size:10px;text-transform:uppercase;letter-spacing:.6px}.table-wrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border:1px solid #24517a;background:#102a45;border-radius:20px;color:#a9d7ff;font-size:10px}.modal-backdrop{position:fixed;inset:0;background:#02060bdc;z-index:1000;display:grid;place-items:center;padding:16px}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#111d2a;border:1px solid var(--line);border-radius:14px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:grid;gap:6px;color:#c5d2df;font-size:11px;font-weight:bold}.form-grid .wide{grid-column:1/-1}.form-grid textarea{min-height:76px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.feedback{padding:10px 12px;margin:12px 0;border-radius:8px;background:#102a45;color:#b9ddff;font-size:12px}.small-actions{display:flex;gap:6px}.small-actions button{padding:7px 9px;font-size:10px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.data-table{min-width:620px}}</style></head><body>
<div id="login" class="login-wrap"><div class="login"><div class="logo">DC <span>MOTRIX</span></div><div class="sub">PANEL DE ADMINISTRACIÓN</div><h1>Bienvenido, administrador</h1><p class="muted">Centro de gestión de tu taller.</p><div class="field"><label>Usuario o correo electrónico</label><input id="admin-email" type="email" autocomplete="username" placeholder="Correo electrónico" required></div><div class="field"><label>Contraseña</label><input id="admin-password" type="password" autocomplete="current-password" placeholder="Contraseña" required></div><button class="btn full" id="real-login">Ingresar al panel</button><button class="link" id="forgot-password">¿Olvidaste tu contraseña?</button><div id="auth-message" class="notice">Acceso privado protegido por Supabase. Solo ingresan cuentas autorizadas por DC MOTRIX.</div></div></div>
<div id="app" class="layout hidden"><aside class="sidebar"><div class="sidehead"><div class="logo">DC <span>MOTRIX</span></div><small>GESTIÓN DEL TALLER</small></div><nav class="menu" id="menu"><button class="active" data-page="inicio"><b>⌂</b>Resumen</button><button data-page="citas"><b>▦</b>Citas</button><button data-page="cotizaciones"><b>▤</b>Cotizaciones</button><button data-page="ordenes"><b>⚙</b>Órdenes de trabajo</button><button data-page="clientes"><b>♙</b>Clientes y vehículos</button><button data-page="inventario"><b>▣</b>Inventario</button><button data-page="ventas"><b>＄</b>Ventas y pagos</button><button data-page="servicios"><b>🔧</b>Servicios y tarifas</button><button data-page="promociones"><b>✦</b>Promociones</button><button data-page="reportes"><b>▥</b>Reportes de ingresos</button><button data-page="configuracion"><b>⚙</b>Configuración</button></nav></aside><main class="main"><div class="topbar"><div><b>Panel administrativo</b><br><small>DC MOTRIX · Chiguirip, Chota</small></div><button class="link" onclick="logout()">Cerrar sesión ↗</button></div><div class="content" id="view"></div></main></div>
<script>
const pages={inicio:['Resumen general','Vista rápida de la actividad del taller.'],citas:['Citas','Solicitudes y agenda de atención.'],cotizaciones:['Cotizaciones','Cotizaciones pendientes, enviadas y aprobadas.'],ordenes:['Órdenes de trabajo','Seguimiento de trabajos y fotografías en cada etapa.'],clientes:['Clientes y vehículos','Datos e historial de atención.'],inventario:['Inventario','Entradas, salidas, costos y alertas de stock.'],ventas:['Ventas y pagos','Ventas, pagos y saldos pendientes.'],servicios:['Servicios y tarifas','Catálogo, paquetes y precios de mano de obra.'],promociones:['Promociones','Descuentos manuales por cotización.'],reportes:['Reportes de ingresos','Ingresos por periodo y tipo de servicio.'],configuracion:['Configuración','Datos del taller y preferencias.']};
function demoLogin(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render('inicio')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(k){
 document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b.dataset.page===k));
 const [t,d]=pages[k];
 if(k==='clientes'){renderClientes();return}
 if(k==='citas'){renderCitas();return}
 if(k==='cotizaciones'){renderCotizaciones();return}
 let body=k==='inicio'?'<div class="cards"><div class="card"><small>Citas por atender</small><div class="number">—</div><small>Consulta en el módulo Citas</small></div><div class="card"><small>Cotizaciones pendientes</small><div class="number">—</div><small>Consulta en Cotizaciones</small></div><div class="card"><small>Órdenes en proceso</small><div class="number">—</div><small>Próxima etapa</small></div><div class="card"><small>Ingresos del mes</small><div class="number">S/ —</div><small>Próxima etapa</small></div></div><div class="section-grid"><div class="panel"><h2>Accesos rápidos</h2><div class="quick"><button onclick="render(\\'citas\\')">Ver citas</button><button onclick="render(\\'cotizaciones\\')">Crear cotización</button><button onclick="render(\\'ordenes\\')">Nueva orden</button><button onclick="render(\\'clientes\\')">Registrar cliente</button></div></div><div class="panel"><h2>Actividad reciente</h2><div class="empty">Aquí aparecerán los movimientos del taller.</div></div></div>':'<div class="panel"><h2>'+t+'</h2><div class="empty">Este módulo se habilitará en la siguiente etapa de desarrollo.</div></div>';
 document.getElementById('view').innerHTML='<div class="heading"><h1>'+t+'</h1><p>'+d+'</p></div>'+body;
}
let clientRows=[],vehicleRows=[];
async function renderClientes(){
 const view=document.getElementById('view');
 view.innerHTML='<div class="heading"><h1>Clientes y vehículos</h1><p>Registra, consulta y actualiza la información de tus clientes y sus vehículos.</p></div><div id="cv-feedback" class="feedback">Cargando información guardada...</div><div class="toolbar"><input id="cv-search" type="search" placeholder="Buscar por cliente, teléfono, placa o modelo..."><button class="action primary" id="new-client">＋ Nuevo cliente</button><button class="action primary" id="new-vehicle">＋ Nuevo vehículo</button></div><div class="panel" style="margin-bottom:15px"><h2>Registro de clientes</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Cliente</th><th>Celular</th><th>Documento</th><th>Vehículos</th><th>Acciones</th></tr></thead><tbody id="clients-body"><tr><td colspan="5" class="empty">Cargando...</td></tr></tbody></table></div></div><div class="panel"><h2>Vehículos registrados</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Vehículo</th><th>Placa</th><th>Propietario</th><th>Año</th><th>Kilometraje</th><th>Acciones</th></tr></thead><tbody id="vehicles-body"><tr><td colspan="6" class="empty">Cargando...</td></tr></tbody></table></div></div>';
 document.getElementById('new-client').onclick=()=>openRecordForm('cliente');
 document.getElementById('new-vehicle').onclick=()=>openRecordForm('vehiculo');
 document.getElementById('cv-search').oninput=drawClientTables;
 try{
  const [c,v]=await Promise.all([authClient.from('clients').select('*').order('full_name'),authClient.from('vehicles').select('*,clients(full_name,phone)').order('make')]);
  if(c.error)throw c.error;if(v.error)throw v.error;
  clientRows=c.data||[];vehicleRows=v.data||[];
  drawClientTables();
  document.getElementById('cv-feedback').textContent='Información sincronizada con la base de datos. Los cambios se guardan al confirmar cada formulario.';
 }catch(e){document.getElementById('cv-feedback').textContent='No se pudo cargar la información: '+e.message}
}
function drawClientTables(){
 const q=(document.getElementById('cv-search')?.value||'').toLowerCase();
 const c=clientRows.filter(x=>[x.full_name,x.phone,x.email,x.document_number].join(' ').toLowerCase().includes(q));
 const v=vehicleRows.filter(x=>[x.plate,x.make,x.model,x.vin,x.engine_number,x.clients?.full_name].join(' ').toLowerCase().includes(q));
 document.getElementById('clients-body').innerHTML=c.length?c.map(x=>'<tr><td><b>'+esc(x.full_name)+'</b><br><span class="muted">'+esc(x.email||'Sin correo')+'</span></td><td>'+esc(x.phone||'—')+'</td><td>'+esc(x.document_number||'—')+'</td><td><span class="pill">'+vehicleRows.filter(z=>z.client_id===x.id).length+' vehículo(s)</span></td><td><div class="small-actions"><button class="action" data-edit-client="'+x.id+'">Editar</button><button class="action danger" data-delete-client="'+x.id+'">Eliminar</button></div></td></tr>').join(''):'<tr><td colspan="5" class="empty">No hay clientes que coincidan con la búsqueda.</td></tr>';
 document.getElementById('vehicles-body').innerHTML=v.length?v.map(x=>'<tr><td><b>'+esc(x.make)+' '+esc(x.model)+'</b><br><span class="muted">'+esc(x.fuel_type||'Combustible no indicado')+'</span></td><td>'+esc(x.plate||'Sin placa')+'</td><td>'+esc(x.clients?.full_name||'—')+'</td><td>'+esc(x.year||'—')+'</td><td>'+ (x.mileage==null?'—':Number(x.mileage).toLocaleString('es-PE')+' km')+'</td><td><div class="small-actions"><button class="action" data-edit-vehicle="'+x.id+'">Editar</button><button class="action danger" data-delete-vehicle="'+x.id+'">Eliminar</button></div></td></tr>').join(''):'<tr><td colspan="6" class="empty">No hay vehículos que coincidan con la búsqueda.</td></tr>';
}
function openRecordForm(type,row=null){
 const isClient=type==='cliente',r=row||{},title=(row?'Editar ':'Registrar nuevo ')+(isClient?'cliente':'vehículo');
 let fields=isClient?[
 ['full_name','Nombre completo','text',true],['phone','Celular','tel',false],['email','Correo electrónico','email',false],['document_number','DNI / RUC','text',false],['address','Dirección','text',false],['notes','Observaciones','textarea',false]
 ]:[
 ['client_id','Propietario','select',true],['plate','Placa','text',false],['make','Marca','text',true],['model','Modelo','text',true],['year','Año','number',false],['color','Color','text',false],['vin','Número de serie / VIN','text',false],['engine_number','Número de motor','text',false],['fuel_type','Combustible','selectfuel',false],['mileage','Kilometraje (km)','number',false],['notes','Observaciones','textarea',false]
 ];
 const controls=fields.map(([name,label,kind,required])=>{
 let value=r[name]??'';
 if(kind==='select')return '<label class="wide">'+label+'<select name="'+name+'" required><option value="">Selecciona un cliente</option>'+clientRows.map(c=>'<option value="'+c.id+'" '+(value===c.id?'selected':'')+'>'+esc(c.full_name)+' · '+esc(c.phone||'Sin celular')+'</option>').join('')+'</select></label>';
 if(kind==='selectfuel')return '<label>'+label+'<select name="'+name+'"><option value="">No especificado</option>'+['Gasolina','Diésel','GLP','GNV','Híbrido','Eléctrico'].map(z=>'<option '+(value===z?'selected':'')+'>'+z+'</option>').join('')+'</select></label>';
 if(kind==='textarea')return '<label class="wide">'+label+'<textarea name="'+name+'">'+esc(value)+'</textarea></label>';
 return '<label '+(name==='address'?'class="wide"':'')+'>'+label+'<input name="'+name+'" type="'+kind+'" value="'+esc(value)+'" '+(required?'required':'')+(kind==='number'?' min="0" step="1"':'')+'></label>';
 }).join('');
 const back=document.createElement('div');back.className='modal-backdrop';back.id='record-modal';
 back.innerHTML='<div class="modal"><div class="modal-head"><h2>'+title+'</h2><button class="action" id="close-record">Cerrar ✕</button></div><form id="record-form"><div class="form-grid">'+fields.map(()=> '').join('')+controls+'</div><div id="record-error" class="feedback" style="display:none"></div><div class="form-actions"><button type="button" class="action" id="cancel-record">Cancelar</button><button class="action primary" id="save-record" type="submit">Guardar '+(isClient?'cliente':'vehículo')+'</button></div></form></div>';
 document.body.appendChild(back);
 const close=()=>back.remove();document.getElementById('close-record').onclick=close;document.getElementById('cancel-record').onclick=close;
 document.getElementById('record-form').onsubmit=async e=>{
  e.preventDefault();const btn=document.getElementById('save-record'),err=document.getElementById('record-error');btn.disabled=true;btn.textContent='Guardando...';err.style.display='none';
  try{
   const fd=new FormData(e.currentTarget),data={};
   for(const [key,val] of fd.entries()){if(key==='year'||key==='mileage')data[key]=val===''?null:Number(val);else data[key]=val.trim()===''?null:val.trim()}
   if(isClient&&!data.full_name)throw new Error('El nombre completo es obligatorio.');
   const table=isClient?'clients':'vehicles';
   const result=row?await authClient.from(table).update(data).eq('id',row.id).select().single():await authClient.from(table).insert(data).select().single();
   if(result.error)throw result.error;
   close();await renderClientes();
  }catch(ex){err.textContent=ex.message||'No se pudo guardar el registro.';err.style.display='block';btn.disabled=false;btn.textContent='Guardar '+(isClient?'cliente':'vehículo')}
 };
}

let appointmentRows=[],quoteRows=[],serviceRows=[];
function dateTimeLocal(v){if(!v)return '';const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function money(v){return 'S/ '+Number(v||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function statusPill(v){return '<span class="pill">'+esc(String(v||'').replaceAll('_',' '))+'</span>'}
function clientOptions(value){return '<option value="">Selecciona cliente</option>'+clientRows.map(c=>'<option value="'+c.id+'" '+(value===c.id?'selected':'')+'>'+esc(c.full_name)+' · '+esc(c.phone||'Sin celular')+'</option>').join('')}
function vehicleOptions(clientId,value){return '<option value="">Sin vehículo / por definir</option>'+vehicleRows.filter(v=>!clientId||v.client_id===clientId).map(v=>'<option value="'+v.id+'" '+(value===v.id?'selected':'')+'>'+esc(v.plate||'Sin placa')+' · '+esc(v.make)+' '+esc(v.model)+'</option>').join('')}
async function loadClientVehicleData(){const [c,v]=await Promise.all([authClient.from('clients').select('*').order('full_name'),authClient.from('vehicles').select('*,clients(full_name,phone)').order('make')]);if(c.error)throw c.error;if(v.error)throw v.error;clientRows=c.data||[];vehicleRows=v.data||[]}
async function renderCitas(){
 const view=document.getElementById('view');
 view.innerHTML='<div class="heading"><h1>Citas</h1><p>Agenda y administra las solicitudes de atención de tus clientes.</p></div><div id="appt-feedback" class="feedback">Cargando citas...</div><div class="toolbar"><input id="appt-search" type="search" placeholder="Buscar cliente, placa o servicio..."><button class="action primary" id="new-appointment">＋ Nueva cita</button></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha y hora</th><th>Cliente</th><th>Vehículo</th><th>Servicio solicitado</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="appointments-body"><tr><td colspan="6" class="empty">Cargando...</td></tr></tbody></table></div></div>';
 document.getElementById('new-appointment').onclick=()=>openAppointmentForm();
 document.getElementById('appt-search').oninput=drawAppointments;
 try{await loadClientVehicleData();const q=await authClient.from('appointments').select('*,clients(full_name,phone),vehicles(plate,make,model)').order('requested_at',{ascending:false});if(q.error)throw q.error;appointmentRows=q.data||[];drawAppointments();document.getElementById('appt-feedback').textContent='Citas sincronizadas con la base de datos.'}
 catch(e){document.getElementById('appt-feedback').textContent='No se pudieron cargar las citas: '+e.message}
}
function drawAppointments(){
 const q=(document.getElementById('appt-search')?.value||'').toLowerCase();
 const rows=appointmentRows.filter(a=>[a.clients?.full_name,a.clients?.phone,a.vehicles?.plate,a.vehicles?.make,a.vehicles?.model,a.service_description,a.status].join(' ').toLowerCase().includes(q));
 document.getElementById('appointments-body').innerHTML=rows.length?rows.map(a=>'<tr><td><b>'+esc(new Date(a.requested_at).toLocaleDateString('es-PE'))+'</b><br><span class="muted">'+esc(new Date(a.requested_at).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}))+'</span></td><td>'+esc(a.clients?.full_name||'Cliente no asignado')+'<br><span class="muted">'+esc(a.clients?.phone||'')+'</span></td><td>'+esc(a.vehicles?.plate||'—')+'<br><span class="muted">'+esc([a.vehicles?.make,a.vehicles?.model].filter(Boolean).join(' '))+'</span></td><td>'+esc(a.service_description||'—')+'</td><td>'+statusPill(a.status)+'</td><td><div class="small-actions"><button class="action" data-edit-appointment="'+a.id+'">Editar</button><button class="action danger" data-delete-appointment="'+a.id+'">Eliminar</button></div></td></tr>').join(''):'<tr><td colspan="6" class="empty">No hay citas registradas.</td></tr>';
}
function openAppointmentForm(row=null){
 const r=row||{},back=document.createElement('div');back.className='modal-backdrop';
 back.innerHTML='<div class="modal"><div class="modal-head"><h2>'+(row?'Editar cita':'Registrar nueva cita')+'</h2><button type="button" class="action" id="close-appt">Cerrar ✕</button></div><form id="appt-form"><div class="form-grid"><label class="wide">Cliente<select name="client_id" id="appt-client">'+clientOptions(r.client_id)+'</select></label><label class="wide">Vehículo<select name="vehicle_id" id="appt-vehicle">'+vehicleOptions(r.client_id,r.vehicle_id)+'</select></label><label>Fecha y hora<input type="datetime-local" name="requested_at" required value="'+esc(dateTimeLocal(r.requested_at||new Date()))+'"></label><label>Estado<select name="status">'+['pendiente','confirmada','atendida','cancelada'].map(x=>'<option value="'+x+'" '+((r.status||'pendiente')===x?'selected':'')+'>'+x.replaceAll('_',' ')+'</option>').join('')+'</select></label><label class="wide">Servicio solicitado<input name="service_description" value="'+esc(r.service_description||'')+'" placeholder="Ej. mantenimiento preventivo, frenos, diagnóstico electrónico"></label><label class="wide">Observaciones<textarea name="notes">'+esc(r.notes||'')+'</textarea></label></div><div id="appt-error" class="feedback" style="display:none"></div><div class="form-actions"><button type="button" class="action" id="cancel-appt">Cancelar</button><button type="submit" class="action primary" id="save-appt">Guardar cita</button></div></form></div>';

async function renderCotizaciones(){

 try{await loadClientVehicleData();const [q,srv]=await Promise.all([authClient.from('quotes').select('*,clients(full_name,phone),vehicles(plate,make,model),quote_items(*)').order('created_at',{ascending:false}),authClient.from('services').select('id,name,labor_price,active').eq('active',true).order('name')]);if(q.error)throw q.error;if(srv.error)throw srv.error;quoteRows=q.data||[];serviceRows=srv.data||[];drawQuotes();document.getElementById('quote-feedback').textContent='Cotizaciones y catálogo de servicios sincronizados.'}

function drawQuotes(){

function quoteItemMarkup(item={}){return '<div class="quote-line form-grid" style="padding:12px;border:1px solid var(--line);border-radius:9px;margin:10px 0"><label class="wide">Descripción<input class="qi-description" value="'+esc(item.description||'')+'" required placeholder="Ej. mano de obra, filtro de aceite, pastillas de freno"></label><label>Cantidad<input class="qi-quantity" type="number" min="0.01" step="0.01" value="'+esc(item.quantity??1)+'" required></label><label>Precio unitario (S/)<input class="qi-price" type="number" min="0" step="0.01" value="'+esc(item.unit_price??0)+'" required></label><div class="wide" style="display:flex;justify-content:space-between;align-items:center"><span class="muted qi-total">Importe: '+money(Number(item.quantity||1)*Number(item.unit_price||0))+'</span><button type="button" class="action danger qi-remove">Quitar concepto</button></div></div>'}
function recalcQuote(){const lines=[...document.querySelectorAll('#quote-items .quote-line')];let subtotal=0;lines.forEach(l=>{const q=Number(l.querySelector('.qi-quantity').value||0),p=Number(l.querySelector('.qi-price').value||0),v=q*p;subtotal+=v;l.querySelector('.qi-total').textContent='Importe: '+money(v)});const discount=Math.max(0,Number(document.getElementById('quote-discount')?.value||0));document.getElementById('quote-subtotal').textContent=money(subtotal);document.getElementById('quote-total').textContent=money(Math.max(0,subtotal-discount));return {subtotal,discount,total:Math.max(0,subtotal-discount)}}
function openQuoteForm(row=null){
 const r=row||{},items=row?.quote_items?.length?row.quote_items:[{description:'',quantity:1,unit_price:0}],back=document.createElement('div');back.className='modal-backdrop';
 back.innerHTML='<div class="modal"><div class="modal-head"><h2>'+(row?'Editar cotización #'+esc(r.quote_number):'Nueva cotización')+'</h2><button type="button" class="action" id="close-quote">Cerrar ✕</button></div><form id="quote-form"><div class="form-grid"><label class="wide">Cliente<select name="client_id" id="quote-client" required>'+clientOptions(r.client_id)+'</select></label><label class="wide">Vehículo<select name="vehicle_id" id="quote-vehicle">'+vehicleOptions(r.client_id,r.vehicle_id)+'</select></label><label>Estado<select name="status">'+['borrador','enviada','aceptada','rechazada','vencida'].map(x=>'<option value="'+x+'" '+((r.status||'borrador')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Válida hasta<input type="date" name="valid_until" value="'+esc(r.valid_until||'')+'"></label><label class="wide">Conceptos de la cotización</label><div class="wide" id="quote-items">'+items.map(quoteItemMarkup).join('')+'</div><div class="wide"><button type="button" class="action" id="add-quote-item">＋ Agregar concepto</button></div><label>Descuento total (S/)<input id="quote-discount" name="discount" type="number" min="0" step="0.01" value="'+esc(r.discount??0)+'"></label><div class="panel"><div class="muted">Subtotal: <b id="quote-subtotal">'+money(r.subtotal)+'</b></div><div style="margin-top:8px">TOTAL: <b id="quote-total">'+money(r.total)+'</b></div></div><label class="wide">Observaciones<textarea name="notes">'+esc(r.notes||'')+'</textarea></label></div><div id="quote-error" class="feedback" style="display:none"></div><div class="form-actions"><button type="button" class="action" id="cancel-quote">Cancelar</button><button type="submit" class="action primary" id="save-quote">Guardar cotización</button></div></form></div>';
 document.body.appendChild(back);const close=()=>back.remove();back.querySelector('#close-quote').onclick=close;back.querySelector('#cancel-quote').onclick=close;
 const itemBox=back.querySelector('#quote-items');const refresh=()=>{recalcQuote()};itemBox.addEventListener('input',refresh);itemBox.addEventListener('click',e=>{if(e.target.closest('.qi-remove')){if(itemBox.querySelectorAll('.quote-line').length>1)e.target.closest('.quote-line').remove();else{const l=e.target.closest('.quote-line');l.querySelector('.qi-description').value='';l.querySelector('.qi-quantity').value=1;l.querySelector('.qi-price').value=0}refresh()}});
 back.querySelector('#add-quote-item').onclick=()=>{itemBox.insertAdjacentHTML('beforeend',quoteItemMarkup());refresh()};
 back.querySelector('#quote-discount').oninput=refresh;
 back.querySelector('#quote-client').onchange=e=>{back.querySelector('#quote-vehicle').innerHTML=vehicleOptions(e.target.value,'')};
 refresh();
 back.querySelector('#quote-form').onsubmit=async e=>{e.preventDefault();const btn=back.querySelector('#save-quote'),err=back.querySelector('#quote-error');btn.disabled=true;btn.textContent='Guardando...';try{
  const fd=new FormData(e.currentTarget),tot=recalcQuote(),lineData=[...itemBox.querySelectorAll('.quote-line')].map(l=>({description:l.querySelector('.qi-description').value.trim(),quantity:Number(l.querySelector('.qi-quantity').value),unit_price:Number(l.querySelector('.qi-price').value)})).filter(x=>x.description);
  if(!fd.get('client_id'))throw new Error('Selecciona un cliente.');if(!lineData.length)throw new Error('Agrega al menos un concepto.');if(lineData.some(x=>!Number.isFinite(x.quantity)||x.quantity<=0||!Number.isFinite(x.unit_price)||x.unit_price<0))throw new Error('Revisa las cantidades y precios.');if(tot.discount>tot.subtotal)throw new Error('El descuento no puede superar el subtotal.');
  const data={client_id:fd.get('client_id'),vehicle_id:fd.get('vehicle_id')||null,status:fd.get('status'),subtotal:tot.subtotal,discount:tot.discount,total:tot.total,valid_until:fd.get('valid_until')||null,notes:fd.get('notes').trim()||null};
  let quoteId;if(row){const u=await authClient.from('quotes').update(data).eq('id',row.id);if(u.error)throw u.error;quoteId=row.id;const del=await authClient.from('quote_items').delete().eq('quote_id',quoteId);if(del.error)throw del.error}else{const ins=await authClient.from('quotes').insert(data).select('id').single();if(ins.error)throw ins.error;quoteId=ins.data.id}
  const insItems=await authClient.from('quote_items').insert(lineData.map(x=>({...x,quote_id:quoteId,line_total:x.quantity*x.unit_price})));if(insItems.error)throw insItems.error;
  close();await renderCotizaciones();
 }catch(ex){err.textContent=ex.message||'No se pudo guardar la cotización.';err.style.display='block';btn.disabled=false;btn.textContent='Guardar cotización'}
 };
}
